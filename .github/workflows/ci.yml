name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Speed rules: jobs run in parallel; a live job starts its database first and installs, compiles and
# builds while it boots; GitHub-hosted runners are discarded afterwards, so nothing is cleaned up
# (stopping HANA alone took 14 s); Node comes from the runner's tool cache (TypeScript and pnpm are
# still pinned by the lockfile and packageManager).

jobs:
  unit:
    name: Java 单元、渲染与金样例测试
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: 编译、运行全部单元测试并生成发布用的源码与 javadoc 包（实库场景在此跳过，不签名）
        run: ./mvnw --batch-mode --threads 1C -P release -Dgpg.skip verify
      - name: 保存测试报告
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: unit-reports
          path: java/*/target/surefire-reports/
          retention-days: 7

  newer-jdk:
    name: Java ${{ matrix.java }} 单元测试
    strategy:
      fail-fast: false
      matrix:
        java: ['21', '25']
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: 在较新的 JDK 上编译并运行全部单元测试（字节码仍按 release 17 生成）
        run: ./mvnw --batch-mode --threads 1C verify

  live:
    name: 实库 / ${{ matrix.database }} / ${{ matrix.language == 'java' && 'Java' || 'TypeScript' }}
    strategy:
      fail-fast: false
      matrix:
        database: [postgres, mysql]
        language: [java, typescript]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: query-ci-${{ matrix.database }}-${{ matrix.language }}-${{ github.run_id }}-${{ github.run_attempt }}
      COMPOSE_FILE: infra/${{ matrix.database }}/compose.yaml
      TEST_DATABASE: ${{ matrix.database }}
      QUERY_REQUIRE_LIVE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: 生成临时密码、设置实库连接并在后台启动数据库
        run: |
          password=$(openssl rand -hex 24)
          echo "::add-mask::$password"
          echo "QUERY_DB_PASSWORD=$password" >> "$GITHUB_ENV"
          case "$TEST_DATABASE" in
            postgres)
              {
                echo "QUERY_PG_URL=jdbc:postgresql://127.0.0.1:55432/query"
                echo "QUERY_PG_USER=query"
                echo "QUERY_PG_PASSWORD=$password"
                echo "JAVA_MODULE=java/query-postgres"
                echo "JAVA_TEST=PostgresLiveTest"
              } >> "$GITHUB_ENV" ;;
            mysql)
              {
                echo "QUERY_MYSQL_URL=jdbc:mysql://127.0.0.1:53306/query?sslMode=DISABLED&allowPublicKeyRetrieval=true"
                echo "QUERY_MYSQL_USER=root"
                echo "QUERY_MYSQL_PASSWORD=$password"
                echo "JAVA_MODULE=java/query-mysql"
                echo "JAVA_TEST=MysqlLiveTest"
              } >> "$GITHUB_ENV" ;;
          esac
          QUERY_DB_PASSWORD="$password" docker compose up --detach
      - if: matrix.language == 'java'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: 数据库启动期间编译 Java
        if: matrix.language == 'java'
        run: ./mvnw --batch-mode -pl "$JAVA_MODULE" -am test-compile
      - if: matrix.language == 'typescript'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - if: matrix.language == 'typescript'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: typescript/package.json
          cache: true
          cache_dependency_path: typescript/pnpm-lock.yaml
      - name: 数据库启动期间构建 TypeScript
        if: matrix.language == 'typescript'
        working-directory: typescript
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: 等待数据库就绪并核对内存限制
        run: |
          docker compose up --detach --wait --wait-timeout 120
          expected=$(docker compose config --format json | jq --arg service "$TEST_DATABASE" '.services[$service].mem_limit | tonumber')
          container=$(docker compose ps -q "$TEST_DATABASE")
          docker inspect "$container" | jq -e --argjson expected "$expected" \
            '.[0].HostConfig | .Memory == $expected and .MemorySwap == $expected'
      - name: 运行 Java 实库场景
        if: matrix.language == 'java'
        run: ./mvnw --batch-mode verify -pl "$JAVA_MODULE" -am "-Dtest=$JAVA_TEST" -Dsurefire.failIfNoSpecifiedTests=false
      - name: 运行 TypeScript 实库场景
        if: matrix.language == 'typescript'
        working-directory: typescript
        run: node --test "test/dist/live/$TEST_DATABASE.live.test.js"
      - name: 失败时收集数据库日志
        if: failure()
        run: |
          mkdir -p target
          docker compose logs --no-color > target/database-containers.log
      - name: 保存测试报告
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: live-reports-${{ matrix.database }}-${{ matrix.language }}
          path: |
            java/*/target/surefire-reports/
            target/database-containers.log
          if-no-files-found: ignore
          retention-days: 7

  # One HANA serves both languages: a second 8 GiB instance would only save the seconds of the
  # TypeScript run. The critical path is the image pull and the boot; everything else overlaps it.
  hana:
    name: 实库 / hana
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      COMPOSE_PROJECT_NAME: query-ci-hana-${{ github.run_id }}-${{ github.run_attempt }}
      COMPOSE_FILE: infra/hana/compose.yaml
      QUERY_REQUIRE_LIVE: '1'
      QUERY_HANA_URL: jdbc:sap://127.0.0.1:39041
      QUERY_HANA_USER: SYSTEM
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: 准备运行 HANA 的主机并在后台启动 HANA
        run: |
          available_kib=$(awk '/MemTotal/ {print $2}' /proc/meminfo)
          test "$available_kib" -ge 10485760
          sudo sysctl -w fs.aio-max-nr=262144 vm.max_map_count=135217728 vm.memory_failure_early_kill=1
          password="E9a$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          echo "QUERY_HANA_PASSWORD=$password" >> "$GITHUB_ENV"
          QUERY_HANA_PASSWORD="$password" docker compose up --detach
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: typescript/package.json
          cache: true
          cache_dependency_path: typescript/pnpm-lock.yaml
      - name: HANA 启动期间编译 Java 并构建 TypeScript
        run: |
          ./mvnw --batch-mode -pl java/query-hana -am test-compile
          cd typescript
          pnpm install --frozen-lockfile
          pnpm build
      - name: 等待 HANA 就绪并核对内存限制
        run: |
          docker compose up --detach --wait --wait-timeout 900
          expected=$(docker compose config --format json | jq '.services.hana.mem_limit | tonumber')
          container=$(docker compose ps -q hana)
          docker inspect "$container" | jq -e --argjson expected "$expected" \
            '.[0].HostConfig | .Memory == $expected and .MemorySwap == $expected'
          docker exec "$container" /bin/bash /query/configure.sh
      - name: 运行 Java 实库场景
        run: ./mvnw --batch-mode verify -pl java/query-hana -am -Dtest=HanaLiveTest -Dsurefire.failIfNoSpecifiedTests=false
      - name: 运行 TypeScript 实库场景
        if: success() || failure()
        working-directory: typescript
        run: node --test test/dist/live/hana.live.test.js
      - name: 失败时收集 HANA 日志
        if: failure()
        run: |
          mkdir -p target
          docker compose logs --no-color > target/hana-container.log
      - name: 保存测试报告
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: live-reports-hana
          path: |
            java/*/target/surefire-reports/
            target/hana-container.log
          retention-days: 7

  spring:
    name: Spring 适配 / ${{ matrix.spring }}
    strategy:
      fail-fast: false
      matrix:
        # 5.3 is the build's own line (Spring Boot 2.7); 6.2 and 7.0 are Boot 3 and Boot 4.
        spring: ['6.2.19', '7.0.9']
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: 用指定的 Spring 版本运行事务测试
        run: ./mvnw --batch-mode verify -pl java/query-spring -am "-Dspring.version=${{ matrix.spring }}" -Dtest=SpringConnectionsTest -Dsurefire.failIfNoSpecifiedTests=false

  typescript:
    name: TypeScript 编译、类型与单元测试
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: typescript/package.json
          cache: true
          cache_dependency_path: typescript/pnpm-lock.yaml
      - name: 编译并运行单元、编译期类型与金样例测试
        working-directory: typescript
        run: |
          pnpm install --frozen-lockfile
          pnpm test
      - name: 运行 SQLite 实库场景（node:sqlite 与 WASM，不需要数据库容器）
        working-directory: typescript
        run: node --test --test-concurrency=1 test/dist/live/sqlite.live.test.js test/dist/live/sqlite-wasm.live.test.js
