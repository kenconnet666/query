# PostgreSQL 17 for local development and CI live tests, self-contained: this folder is all you need.
# The memory limit lives only here; CI reads it back and checks that Docker enforced it.
#
# HOW TO DEPLOY AND USE (WSL Debian; a plain Debian/Ubuntu server works the same way)
#
# 1. Open WSL from Windows (skip on a server):
#      wsl -d Debian
# 2. Install Docker Engine with the compose plugin (skip when `docker compose version` already works):
#      curl -fsSL https://get.docker.com | sh
# 3. Go to this folder (the WSL path of infra/postgres in the repository, or wherever you copied it):
#      cd /mnt/c/Users/Administrator/IdeaProjects/query/infra/postgres
# 4. Create the password file once (.env is git-ignored; compose reads it automatically):
#      printf 'QUERY_DB_PASSWORD=%s\n' "$(openssl rand -hex 16)" > .env
#    Add APT_MIRROR=mirrors.aliyun.com to .env when deb.debian.org is slow.
#    Read the password later with:  grep PASSWORD .env
# 5. Build the tool layer and start, about one minute the first time. The state must become "healthy":
#      docker compose up -d --build
#      docker compose ps
# 6. Connect from Windows with the WSL address (172.x.x.x), not localhost. Look it up, the first address
#    is the one to use, and it changes after a WSL restart:
#      wsl -d Debian hostname -I
#    Then use jdbc:postgresql://<WSL_IP>:55432/query, user query, password QUERY_DB_PASSWORD.
#    The port is published on 0.0.0.0; change it with QUERY_PG_PORT in .env.
# 7. Everyday commands, from this folder:
#      docker compose logs -f postgres                            # follow the log, Ctrl+C to leave
#      docker compose exec postgres ping -c 2 host.docker.internal   # ops tools live inside the container
#      docker compose stop                                        # stop, data is kept
#      docker compose up -d                                       # start again, no rebuild
#      docker compose down -v                                     # delete the container AND its data
name: query-postgres

services:
  postgres:
    build:
      context: .
      args:
        APT_MIRROR: ${APT_MIRROR:-}
    image: query-dev/postgres:17.11
    platform: linux/amd64
    restart: unless-stopped
    mem_limit: 512m
    memswap_limit: 512m
    mem_reservation: 128m
    cpus: 1.0
    pids_limit: 128
    environment:
      POSTGRES_DB: query
      POSTGRES_USER: query
      POSTGRES_PASSWORD: ${QUERY_DB_PASSWORD:?Set QUERY_DB_PASSWORD in .env or the environment}
    command: [postgres, -c, shared_buffers=128MB, -c, max_connections=30]
    ports:
      - "${QUERY_PG_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD, pg_isready, -h, 127.0.0.1, -U, query, -d, query]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
